<div
  class="min-h-screen bg-background text-foreground flex flex-col font-sans transition-colors duration-200"
>
  <!-- Top Navigation Header -->
  <header class="border-b bg-card/90 backdrop-blur sticky top-0 z-50 shadow-sm dark:shadow-none">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
            <defs>
              <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#2563eb" />
              </linearGradient>
              <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
            </defs>
            <path
              d="M256 48 L404 104 V232 C404 348 334 428 256 460 C178 428 108 348 108 232 V104 L256 48 Z"
              fill="none"
              stroke="url(#shieldGrad)"
              stroke-width="26"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M176 252 L236 312 L348 192"
              fill="none"
              stroke="url(#checkGrad)"
              stroke-width="40"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-xl font-extrabold tracking-tight">CHECKMATE</h1>
            <span
              hlmBadge
              variant="outline"
              class="rounded-full font-mono text-primary border-primary/40 bg-primary/10"
              >{{ version() }}</span
            >
          </div>
          <p hlmMuted class="text-[11px] font-medium">Local SAST &amp; Secret Scanning Engine</p>
        </div>
      </div>

      <!-- Engine Status & Controls -->
      <div class="flex items-center space-x-3">
        <!-- Theme Switcher Button -->
        <button hlmBtn variant="outline" size="icon" (click)="toggleTheme()" title="Toggle Theme">
          @if (theme() === 'dark') {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>
          } @else {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
          }
        </button>

        <!-- Live Pulse -->
        <div hlmBadge variant="outline" class="rounded-full px-3 py-1.5 gap-2">
          <span class="relative flex h-2 w-2">
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"
            ></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-success"></span>
          </span>
          <span class="font-mono text-[11px] text-muted-foreground">CHECKMATE ENGINE ONLINE</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t">
      <nav class="flex space-x-6">
        <a
          routerLink="/dashboard"
          routerLinkActive="border-primary text-primary font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="py-3 px-1 border-b-2 border-transparent text-muted-foreground hover:text-foreground text-xs uppercase tracking-wider transition cursor-pointer"
        >
          Overview
        </a>
        <a
          routerLink="/projects"
          routerLinkActive="border-primary text-primary font-semibold"
          class="py-3 px-1 border-b-2 border-transparent text-muted-foreground hover:text-foreground text-xs uppercase tracking-wider transition cursor-pointer flex items-center space-x-1.5"
        >
          <span>Projects</span>
        </a>
        <a
          routerLink="/settings"
          routerLinkActive="border-primary text-primary font-semibold"
          class="py-3 px-1 border-b-2 border-transparent text-muted-foreground hover:text-foreground text-xs uppercase tracking-wider transition cursor-pointer flex items-center space-x-1.5"
        >
          <span>Settings</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <router-outlet></router-outlet>
  </main>
</div>
