# CheckMate — release pipeline.
#
# One tag produces every desktop artefact for every platform, or produces none.
# Publication is gated on all three platform jobs succeeding, because a release
# that is complete on macOS and missing on Windows is worse than no release: it
# is discovered by the user rather than by CI.
#
# Three things changed from the previous version of this file, all for the same
# reason — an artefact nobody can verify is an artefact nobody should trust:
#
#   1. No `go mod edit` / `go get @main`. The previous pipeline rewrote its own
#      go.mod mid-build to re-resolve checkmate to a moving branch, so a v2.1.0
#      tag did not identify the code that was built and two builds of the same
#      tag were not the same artefact. go.mod now pins a released version and
#      this builds the repository exactly as committed.
#   2. Checksums, keyless cosign signatures, SBOMs and provenance, none of
#      which require a secret.
#   3. The Linux job now produces the .deb and .rpm its name always claimed.
#
# Platform signing remains optional and is guarded on secrets, so a fork with
# none configured still gets a complete, verifiable, unsigned release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artefacts without publishing a release'
        type: boolean
        default: true

permissions:
  contents: read

env:
  APP_NAME: CheckMate
  WAILS_VERSION: v2.13.0

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ldflags: ${{ steps.v.outputs.ldflags }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            # A dispatch build is not a release and must not claim to be one.
            VERSION="v0.0.0-dev.$(date -u +%Y%m%d%H%M%S)"
            PUBLISH=false
          fi

          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            PUBLISH=false
          fi

          COMMIT="$(git rev-parse --short=12 HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="checkmate-app/pkg/version"

          {
            echo "version=${VERSION}"
            echo "publish=${PUBLISH}"
            echo "ldflags=-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

          echo "Building ${VERSION} (${COMMIT}); publish=${PUBLISH}"

  # ── macOS ────────────────────────────────────────────────────────────────
  macos:
    name: macOS (universal)
    needs: meta
    runs-on: macos-14
    # Job level, not step level. A step-level `env:` is not visible to that
    # same step's `if:`, which is evaluated before the step environment is
    # constructed — so guarding on it there silently never matches, and signing
    # is skipped on a release that was supposed to be signed.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build universal app bundle
        run: |
          wails build -platform darwin/universal -clean \
            -ldflags "${{ needs.meta.outputs.ldflags }}"

      # Signing and notarisation are one unit: a bundle that is signed but not
      # notarised is treated by Gatekeeper much as an unsigned one, while
      # carrying a signature suggesting otherwise. If signing happens,
      # notarisation must succeed or this job fails.
      - name: Codesign and notarise
        if: env.APPLE_CERT_P12 != ''
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "build/bin/${APP_NAME}.app"
          codesign --verify --strict --verbose=2 "build/bin/${APP_NAME}.app"

          ditto -c -k --keepParent "build/bin/${APP_NAME}.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m

          # Stapling is what makes the ticket available offline. Without it, a
          # first launch on a machine with no network shows the same warning
          # notarisation was meant to remove.
          xcrun stapler staple "build/bin/${APP_NAME}.app"
          xcrun stapler validate "build/bin/${APP_NAME}.app"

          echo "SIGNED=true" >> "$GITHUB_ENV"

      # No Apple Developer Program membership, by choice: CheckMate is free
      # open-source software, and a $99/year rent to Apple for the privilege of
      # giving it away is not a cost this project will carry. Ad-hoc signing is
      # the free alternative. It does not satisfy Gatekeeper — only a Developer
      # ID plus notarisation does — but it is not cosmetic either:
      #
      #   * arm64 Macs refuse to execute a Mach-O with no signature at all, so
      #     the universal bundle needs one regardless;
      #   * it gives the bundle a stable code identity, which is what the
      #     keychain, TCC and the firewall key their per-app grants on. Without
      #     it every rebuild looks like a new app and the user re-approves
      #     everything;
      #   * it makes the bundle tamper-evident locally: `codesign --verify`
      #     fails if anything inside was modified after we built it.
      #
      # Distribution trust comes from SHA256SUMS and the keyless cosign
      # signature instead, which is stronger evidence than Apple's — publicly
      # logged in Rekor and tied to this workflow, not to whoever paid Apple.
      - name: Ad-hoc sign
        if: env.APPLE_CERT_P12 == ''
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "build/bin/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "build/bin/${APP_NAME}.app"

      - name: Package DMG and ZIP
        run: |
          set -euo pipefail
          cd build/bin

          # ditto, not zip: zip does not preserve the extended attributes that
          # carry the stapled notarisation ticket, so a zip-archived signed
          # bundle arrives unnotarised.
          ditto -c -k --keepParent "${APP_NAME}.app" "${APP_NAME}-macos-universal.zip"

          # hdiutil intermittently fails with "Resource busy" on CI runners:
          # something else still holds the source folder — Spotlight indexing
          # the freshly signed bundle, or a stale attachment from an earlier
          # create — and the failure is transient rather than a defect in what
          # is being packaged. Observed on the v2.3.0 run, where every other
          # platform succeeded and a plain re-run passed unchanged.
          #
          # So: retry rather than fail the release. Detaching any leftover
          # mount of the same volume first addresses the recurring cause; the
          # sleep gives indexing time to release the folder. A hard failure
          # after three attempts is a real problem and still fails the job.
          for attempt in 1 2 3; do
            if hdiutil create -volname "${APP_NAME}" -srcfolder "${APP_NAME}.app" \
                 -ov -format UDZO "${APP_NAME}-macos-universal.dmg"; then
              echo "DMG created on attempt ${attempt}."
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "hdiutil failed three times; failing the job." >&2
              exit 1
            fi

            echo "hdiutil failed (attempt ${attempt}); detaching stale mounts and retrying." >&2
            hdiutil detach "/Volumes/${APP_NAME}" -force 2>/dev/null || true
            sleep 15
          done

      - name: Sign and staple the DMG
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          cd build/bin
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
            "${APP_NAME}-macos-universal.dmg"
          xcrun notarytool submit "${APP_NAME}-macos-universal.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "${APP_NAME}-macos-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            build/bin/${{ env.APP_NAME }}-macos-universal.dmg
            build/bin/${{ env.APP_NAME }}-macos-universal.zip
          if-no-files-found: error

  # ── Windows ──────────────────────────────────────────────────────────────
  windows:
    name: Windows (${{ matrix.arch }})
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS and Wails CLI
        run: |
          choco install nsis -y --no-progress
          go install github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build application and installer
        run: |
          wails build -platform windows/${{ matrix.arch }} -clean -nsis `
            -ldflags "${{ needs.meta.outputs.ldflags }}"

      - name: Authenticode sign
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))

          # RFC 3161 timestamping, so the signature outlives the certificate.
          # Without it every artefact starts warning the day the cert expires,
          # including releases that were valid when they were published.
          Get-ChildItem -Path build\bin -Include *.exe -Recurse | ForEach-Object {
            & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          Remove-Item $pfx -Force

      - name: Package portable ZIP
        run: |
          cd build\bin
          Compress-Archive -Path "$env:APP_NAME.exe" `
            -DestinationPath "$env:APP_NAME-windows-${{ matrix.arch }}.zip"
          Get-ChildItem -Filter '*installer*.exe' | ForEach-Object {
            Rename-Item $_.FullName "$env:APP_NAME-windows-${{ matrix.arch }}-installer.exe"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            build/bin/${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip
            build/bin/${{ env.APP_NAME }}-windows-${{ matrix.arch }}-installer.exe
          if-no-files-found: error

  # ── Linux ────────────────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            # Native arm64 runner rather than cross-compilation: Wails links
            # against GTK and WebKit through cgo, and cross-compiling that
            # reliably needs a sysroot this pipeline has no reason to maintain.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config \
            fuse libfuse2 desktop-file-utils

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI and nfpm
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build application
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          wails build -platform linux/${{ matrix.arch }} -clean -tags webkit2_41 \
            -ldflags "${{ needs.meta.outputs.ldflags }}"

      - name: Package tarball
        run: |
          set -euo pipefail
          cd build/bin
          tar -czf "${APP_NAME}-linux-${{ matrix.arch }}.tar.gz" "${APP_NAME}"

      # nfpm strips the leading v; a Debian version of "v2.1.0" is invalid and
      # dpkg rejects it at install time rather than at build time.
      - name: Package .deb and .rpm
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export VERSION="${VERSION#v}"
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t build/bin/
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t build/bin/

      # AppImage answers distributions whose WebKit is the wrong vintage. It is
      # best-effort: losing it should cost this release an AppImage, not the
      # release.
      - name: Package AppImage
        continue-on-error: true
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            amd64) LD_ARCH=x86_64 ;;
            arm64) LD_ARCH=aarch64 ;;
          esac

          curl -fsSL -o linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LD_ARCH}.AppImage"
          chmod +x linuxdeploy

          mkdir -p AppDir/usr/bin
          cp "build/bin/${APP_NAME}" AppDir/usr/bin/checkmate-app

          # packaging/linux/checkmate-app.png rather than build/appicon.png for
          # two reasons. linuxdeploy accepts icons only at the hicolor sizes and
          # rejects the 1024x1024 appicon outright, which is why no AppImage has
          # ever been produced by this pipeline. It also derives the installed
          # icon name from the file's basename, which must match the desktop
          # entry's Icon=checkmate-app or the AppImage builds without an icon.
          ./linuxdeploy --appdir AppDir \
            --desktop-file packaging/linux/checkmate-app.desktop \
            --icon-file packaging/linux/checkmate-app.png \
            --output appimage

          mv CheckMate*.AppImage "build/bin/${APP_NAME}-linux-${{ matrix.arch }}.AppImage"

      # continue-on-error keeps a failed AppImage from sinking the release, but
      # it also meant nobody noticed it had never succeeded: the upload globs
      # *.AppImage alongside artefacts that do exist, so if-no-files-found never
      # fires. State the outcome where it will be read.
      - name: Report AppImage outcome
        if: always()
        run: |
          set -euo pipefail
          if ls build/bin/*.AppImage > /dev/null 2>&1; then
            echo "✔ AppImage produced for ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No AppImage produced for ${{ matrix.arch }} — this release ships without one."
            echo "⚠ AppImage MISSING for ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/bin/*.tar.gz
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.AppImage
          if-no-files-found: error

  # ── Containers ───────────────────────────────────────────────────────────
  docker:
    name: Container image
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/checkmate-app
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          # Suppresses the .dockerbuild build-record artefact. It is a debugging
          # aid we do not consume, and as a run artefact it is indistinguishable
          # to a downloader from something that belongs in the release.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image nobody can enumerate the contents of is an image nobody
          # can tell you is vulnerable.
          sbom: true
          provenance: mode=max

  # ── Integrity evidence and publication ───────────────────────────────────
  publish:
    name: Publish release
    needs: [meta, macos, windows, linux, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signs against the workflow's OIDC identity. This is why
      # the integrity evidence needs no signing secret at all.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Named explicitly rather than downloading everything. Other jobs may
      # upload artefacts of their own — docker/build-push-action attaches a
      # build record — and an unfiltered download makes the release depend on
      # artefacts that are not release assets. In v2.2.0 that build record
      # failed to download and took the entire publication with it, after all
      # six platforms had built successfully. Anything not listed here is not
      # a release asset and must not be able to break, or enter, a release.
      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: '{macos,linux-amd64,linux-arm64,windows-amd64,windows-arm64}'
          merge-multiple: true

      # A pattern that matches nothing yields an empty staging directory, and
      # a release that silently ships no binaries. Assert the manifest instead
      # of trusting the glob.
      - name: Verify expected artefacts are present
        working-directory: staging
        run: |
          set -euo pipefail
          missing=0
          for f in \
            "${APP_NAME}-macos-universal.dmg" \
            "${APP_NAME}-windows-amd64.zip" \
            "${APP_NAME}-windows-arm64.zip"
          do
            [ -f "$f" ] || { echo "::error::missing expected artefact: $f"; missing=1; }
          done
          for pat in '*linux*amd64*' '*linux*arm64*'; do
            compgen -G "$pat" > /dev/null \
              || { echo "::error::no artefact matching: $pat"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { echo "--- staging ---"; ls -la; exit 1; }
          echo "✔ all expected platform artefacts present"
        shell: bash

      - name: Checksums
        working-directory: staging
        run: |
          set -euo pipefail
          # ./* rather than *: a release artefact whose name begins with a
          # dash would otherwise be read by sha256sum as an option.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # Pinned to an exact version, not `@v4`. sigstore publishes only exact
      # patch tags for this action — there is no moving `v4` — so `@v4` is
      # unresolvable and fails the job at set-up, before a single step runs.
      # That is what broke the v2.3.1 publish after all seven builds had
      # succeeded. Bump this deliberately; it will not drift on its own.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign artefacts
        working-directory: staging
        run: |
          set -euo pipefail
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          # Signed last, so its own signature covers the final manifest.
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: staging/checkmate-app-${{ needs.meta.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build provenance attestation
        if: needs.meta.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'staging/*'

      - name: Create GitHub release
        if: needs.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: staging/*
          tag_name: ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          body: |
            ## Verifying this release

            Every asset is checksummed and signed with keyless Sigstore, which
            requires no key material from us and no trust in this repository's
            secrets.

            ```sh
            sha256sum -c SHA256SUMS --ignore-missing

            cosign verify-blob \
              --certificate CheckMate-macos-universal.dmg.pem \
              --signature   CheckMate-macos-universal.dmg.sig \
              --certificate-identity-regexp '^https://github.com/adedayo/checkmate-app/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              CheckMate-macos-universal.dmg
            ```

      - name: Summarise dry run
        if: needs.meta.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run — nothing published"
            echo ""
            echo '```'
            cat staging/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Package managers ─────────────────────────────────────────────────────
  # Deliberately not a blocker: a tap that fails to bump is an inconvenience,
  # whereas a release withheld because of it is an outage. The release is
  # already published by this point.
  package-managers:
    name: Update package managers
    needs: [meta, publish]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew cask
        # Exact version for the same reason as cosign-installer above: this
        # action publishes no moving `v4` tag. This job is allowed to fail
        # without failing the release, so a broken ref here would have been a
        # silently un-bumped tap rather than an obvious error.
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: checkmate-app
          formula-path: Casks/checkmate-app.rb
          homebrew-tap: adedayo/homebrew-tap
          download-url: https://github.com/adedayo/checkmate-app/releases/download/${{ needs.meta.outputs.version }}/CheckMate-macos-universal.dmg
          commit-message: 'checkmate-app ${{ needs.meta.outputs.version }}'
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Submit to winget
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Adedayo.CheckMate
          version: ${{ needs.meta.outputs.version }}
          installers-regex: '-installer\.exe$'
